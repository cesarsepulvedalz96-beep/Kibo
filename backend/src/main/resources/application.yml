debug: false
logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: OFF
spring:
  application:
    name: stockflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockflow}
    username: ${DB_USER:stockflow}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  port: 8080
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${APP_COOKIE_SECURE:true}
        same-site: lax
app:
  trusted-proxies: ${APP_TRUSTED_PROXIES:}
  allowed-origin: ${APP_ALLOWED_ORIGIN:http://localhost:5173}
  cookie-secure: ${APP_COOKIE_SECURE:true}
  bootstrap:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  storage:
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:us-east-1}
